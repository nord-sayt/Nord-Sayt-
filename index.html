<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Nord Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⚡ Nord Pro</h1>
  <nav>
    <button onclick="show('home')">خانه</button>
    <button onclick="show('login')">ورود</button>
    <button onclick="show('profile')">پروفایل</button>
    <button onclick="show('owner')">اونر</button>
  </nav>
</header>

<main>

<section id="home">
  <h2>📢 اعلامیه‌ها</h2>
  <div id="announcements"></div>

  <h2>📡 سرور</h2>
  <p>IP: <span id="ip"></span></p>
  <p>بله: <span id="bale"></span></p>
</section>

<section id="login" class="hidden">
  <h2>ورود / ثبت نام</h2>
  <input id="user" placeholder="یوزرنیم">
  <input id="pass" type="password" placeholder="پسورد">
  <button onclick="register()">ثبت نام</button>
  <button onclick="login()">ورود</button>
</section>

<section id="profile" class="hidden">
  <h2>👤 پروفایل</h2>
  <p id="me"></p>
</section>

<section id="owner" class="hidden">
  <h2>👑 پنل اونر</h2>

  <textarea id="annText"></textarea>
  <button onclick="addAnn()">ثبت اعلامیه</button>

  <input id="ipInput" placeholder="IP سرور">
  <input id="baleInput" placeholder="کانال بله">
  <button onclick="saveSettings()">ذخیره</button>

  <h3>👥 تیم 5 نفره</h3>
  <input id="t1"><input id="t2"><input id="t3"><input id="t4"><input id="t5">
  <button onclick="saveTeam()">ذخیره تیم</button>
</section>

</main>

<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
